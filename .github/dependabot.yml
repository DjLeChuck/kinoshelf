# Keeps what is pinned by digest or commit from silently going stale: the Dockerfile's base images
# and the workflows' actions. One grouped pull request per ecosystem and week.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
    commit-message:
      prefix: chore(docker)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
