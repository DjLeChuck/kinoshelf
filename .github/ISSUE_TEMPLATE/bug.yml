name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: 'Output of `kinoshelf --version`, or `summary.json` in the diagnostic archive.'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker, Standalone binary, From source]
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: File names involved
      description: For a wrong or missing match, the file or folder names as they are on disk.
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: Attach the archive from System › Diagnostic. It holds no secret, but it does hold file and folder names.
