name: Release

# The standalone binary, one archive per platform, next to the Docker image (docker.yml). A pull
# request that touches how it is made builds and tests it without publishing anything.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packages/sea/**
      - packages/e2e/stack.mjs
      - scripts/**
      - Makefile
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # The Node that gets embedded: pinned, since node:sqlite and single executables are still
  # moving. Read the release notes before each bump.
  NODE_VERSION: 26.12.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Building FFmpeg takes a while and its inputs rarely change: the script is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/ffprobe-out
          key: ffprobe-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffprobe.sh') }}
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "KINOSHELF_VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV" ;;
            *) echo "KINOSHELF_VERSION=0.0.0-dev" >>"$GITHUB_ENV" ;;
          esac
      # build, build:web, ffprobe, the bundle and the executable, with the licences beside it.
      - run: make FFPROBE_RUN= sea
      - run: scripts/package-sea.sh "$KINOSHELF_VERSION" ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            packages/sea/dist/*.tar.xz
            packages/sea/dist/*.sha256
          if-no-files-found: error

  # What is published has run: the whole e2e suite against the binary, then a start in clean
  # images with no Node. Linux x64 only: it is the platform of the runners.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x64
          path: archive
      - name: Unpack
        run: |
          (cd archive && sha256sum -c ./*.sha256)
          tar -C archive -xJf archive/*.tar.xz
          echo "KINOSHELF_E2E_BINARY=$(echo "$PWD"/archive/kinoshelf-*/kinoshelf)" >>"$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kinoshelf/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @kinoshelf/e2e test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          retention-days: 7
      # ffmpeg makes the clip the smoke test reads.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: scripts/smoke-sea.sh archive/*.tar.xz

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only this job writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd archives
          cat ./*.sha256 >SHA256SUMS
          sha256sum -c SHA256SUMS
          rm -- *.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tar.xz SHA256SUMS
