name: Docker

on:
  pull_request:
    paths: [Dockerfile, docker/**, .dockerignore, .github/workflows/docker.yml]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 is built under QEMU: slow, but the image is only pnpm and tsc, nothing to compile
      # (better-sqlite3 ships a prebuilt binary for musl arm64).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # A pull request builds both platforms without publishing, so a broken arm64 build shows up
      # before the merge.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows the newest release tag; main is published as `edge`.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
