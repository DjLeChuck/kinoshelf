# Jellyfin naming, NFO and images, per https://jellyfin.org/docs/general/server/media/movies/,
# https://jellyfin.org/docs/general/server/media/shows/ and https://jellyfin.org/docs/general/server/metadata/
#
# The video file must start with its folder's name, id tag included.
id: jellyfin
name: Jellyfin

# Multi-episode files are named with the first and last episode: S02E18-E19.
episodeRangeSeparator: '-E'

templates:
  # Exactly Plex's `{tmdb-<id>}`, so one library is named the same way for both. Jellyfin's
  # documentation gives `[tmdbid-<id>]`; its code (`PathExtensions.GetAttributeValue`) reads `tmdb`
  # as an alias of `tmdbid`, and brackets, parentheses or braces around it.
  movieFolder: '{title} ({year}) \{tmdb-{tmdb}\}'
  movieFile: '{title} ({year}) \{tmdb-{tmdb}\}'
  # Several qualities of a movie share its folder: `<file> - 2160p`, per the player's multi-version rules.
  movieVersion: ' - {version}'
  seriesFolder: '{title} ({year}) \{tmdb-{tmdb}\}'
  # `Season 01`, never `S01`; specials go in `Season 00`.
  seasonFolder: 'Season {season:02}'
  episodeFile: '{title} ({year}) S{season:02}E{episode:02}'
  # Several qualities of an episode share its season folder: `<file> - 2160p`.
  episodeVersion: ' - {version}'

# Kodi-format NFO: `movie.nfo`, `tvshow.nfo`, and `<video>.nfo` for an episode. Local metadata
# and images win over Jellyfin's providers.
nfo:
  format: kodi
  movie: movie.nfo
  episode: '{file}.nfo'
  series: tvshow.nfo

# Jellyfin documents `poster` and `backdrop` (`background`, `fanart`… are accepted names) for a
# movie or a show. For a season it only says a season folder may hold the same names, so the
# season poster is a plain `poster.jpg` there. Its code (`LocalImageProvider`) also reads Kodi's
# `seasonNN-poster.jpg` from the show folder (`season-specials-poster.jpg` for season 0), never
# Plex's `SeasonNN.jpg`. It also reads `logo` (the title art, a transparent PNG) for a movie or a
# show.
artwork:
  - { kind: poster, name: poster.jpg }
  - { kind: fanart, name: background.jpg }
  - { kind: logo, name: logo.png }
  - { kind: season-poster, name: poster.jpg }

filesystem:
  forbidden: windows
  replacement: ''
  maxSegmentBytes: 255
