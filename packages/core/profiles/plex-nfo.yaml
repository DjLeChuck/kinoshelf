# Plex with the optional "Plex NFO Movie" / "Plex NFO Series" agents (Plex Media Server 1.43.1+),
# per https://support.plex.tv/articles/using-nfo-metadata-files-with-plex/
#
# The agents read Kodi-format NFO and local images, with no online lookup, and take the id from
# `<uniqueid type="tmdb">`: the names carry none (as in `plex-no-id`). Plex's default agents
# ignore all of this: use `plex` for them.
id: plex-nfo
name: Plex (NFO)

# Multi-episode files are named with the first and last episode: s02e18-e19.
episodeRangeSeparator: '-e'

templates:
  movieFolder: '{title} ({year})'
  movieFile: '{title} ({year})'
  # Several qualities of a movie share its folder: `<file> - 2160p`, per the player's multi-version rules.
  movieVersion: ' - {version}'
  seriesFolder: '{title} ({year})'
  # The English word "Season" is mandatory, whatever the content language.
  seasonFolder: 'Season {season:02}'
  episodeFile: '{title} ({year}) - s{season:02}e{episode:02}'
  # Several qualities of an episode share its season folder: `<file> - 2160p`.
  episodeVersion: ' - {version}'

# Same files as `jellyfin`: `movie.nfo` and `tvshow.nfo`, and an NFO carrying the video's name for
# an episode (the minimum Plex asks for). Season NFO is "mostly ignored": none is written.
nfo:
  format: kodi
  movie: movie.nfo
  episode: '{file}.nfo'
  series: tvshow.nfo

# Plex documents `poster.jpg` and `background.jpg` for a movie or a show; it names nothing for a
# season, so none is written.
artwork:
  - { kind: poster, name: poster.jpg }
  - { kind: fanart, name: background.jpg }

filesystem:
  # Libraries are often shared over SMB: avoid characters Windows cannot store.
  forbidden: windows
  replacement: ''
  maxSegmentBytes: 255
